<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KV-Diagramm</title>
<style>
  /* Farben: Papier + Tinte, Hairlines statt Schatten. Farbe tragen nur die Blöcke
     im Diagramm und der don't-care-Wert. */
  :root {
    --paper:#f6f5f2; --panel:#fffffe; --sunk:#f0efea;
    --ink:#17181b; --ink-2:#5c5e66; --ink-3:#8b8d95;
    --line:#dedbd4; --line-soft:#ebe9e3;
    --dc:#9a6a07; --focus:#1a56db;
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
    --r-ctl:5px; --r-panel:9px;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#111214; --panel:#191a1e; --sunk:#202227;
      --ink:#ececed; --ink-2:#a2a4ac; --ink-3:#787a82;
      --line:#2e3138; --line-soft:#24262b;
      --dc:#e3b23c; --focus:#7aa2f7;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin:0; background:var(--paper); color:var(--ink);
    font:15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-feature-settings: "tnum";
  }
  .wrap { max-width:1180px; margin:0 auto; padding:0 var(--s4) var(--s6); }

  header { border-bottom:1px solid var(--line); background:var(--panel); }
  header .wrap { padding-top:var(--s5); padding-bottom:var(--s4); display:flex;
                 flex-wrap:wrap; align-items:baseline; gap:var(--s2) var(--s4); }
  h1 { font-size:1.3rem; font-weight:650; letter-spacing:-.01em; margin:0; }
  header p { margin:0; color:var(--ink-2); font-size:.92rem; }

  main { padding-top:var(--s5); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:var(--r-panel); }
  .panel > h2 {
    margin:0; padding:var(--s3) var(--s4); border-bottom:1px solid var(--line-soft);
    font-size:.74rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3);
    display:flex; justify-content:space-between; align-items:baseline; gap:var(--s3);
  }
  .panel > h2 .tag { text-transform:none; letter-spacing:0; font-family:var(--mono); font-weight:400; }
  .body { padding:var(--s4); }

  /* Steuerleiste */
  .controls { display:flex; flex-wrap:wrap; align-items:center; gap:var(--s3) var(--s5);
              padding:var(--s3) var(--s4); margin-bottom:var(--s4); }
  .field { display:flex; align-items:center; gap:var(--s2); }
  .field > .lbl { font-size:.82rem; color:var(--ink-2); }
  .seg { display:flex; border:1px solid var(--line); border-radius:var(--r-ctl); overflow:hidden; }
  .seg button {
    font:inherit; font-size:.88rem; line-height:1; padding:7px 11px; border:0; cursor:pointer;
    background:var(--panel); color:var(--ink-2); border-right:1px solid var(--line-soft);
  }
  .seg button:last-child { border-right:0; }
  .seg button:hover { background:var(--sunk); color:var(--ink); }
  .seg button[aria-pressed="true"] { background:var(--ink); color:var(--panel); }
  .btn { font:inherit; font-size:.88rem; line-height:1; padding:7px 11px; cursor:pointer;
         background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:var(--r-ctl); }
  .btn:hover { background:var(--sunk); }
  :focus-visible { outline:2px solid var(--focus); outline-offset:1px; border-radius:2px; }

  .cols { display:grid; grid-template-columns: 280px minmax(0,1fr); gap:var(--s4); align-items:start; }
  @media (max-width: 900px) { .cols { grid-template-columns:1fr; } }
  .stack { display:flex; flex-direction:column; gap:var(--s4); }

  /* Wertetabelle */
  #col { width:100%; font-family:var(--mono); font-size:.9rem; letter-spacing:.1em;
         padding:7px 9px; border:1px solid var(--line); border-radius:var(--r-ctl);
         background:var(--sunk); color:inherit; }
  #col.bad { border-color:var(--dc); background:color-mix(in srgb, var(--dc) 10%, var(--sunk)); }
  .hint { color:var(--ink-2); font-size:.8rem; line-height:1.45; }
  #tt { max-height:62vh; overflow:auto; scrollbar-width:thin; scrollbar-color:var(--line) transparent; border-top:1px solid var(--line-soft); margin-top:var(--s3); }
  table.tt { border-collapse:collapse; width:100%; font-family:var(--mono); font-size:.86rem; }
  table.tt th { position:sticky; top:0; z-index:2; background:var(--panel); color:var(--ink-3);
                font-weight:600; font-size:.74rem; padding:6px 4px; border-bottom:1px solid var(--line); }
  table.tt td { padding:0; text-align:center; border-bottom:1px solid var(--line-soft); }
  table.tt tbody tr:hover td { background:var(--sunk); }
  table.tt td.in { color:var(--ink-2); padding:3px 4px; }
  table.tt td.idx { color:var(--ink-3); font-size:.74rem; padding:3px 6px; text-align:right; }
  td.val { background:color-mix(in srgb, var(--ink) 4%, transparent); }
  td.val button { width:100%; border:0; background:none; font:inherit; font-weight:700;
                  padding:4px 0; cursor:pointer; color:inherit; }

  /* KV-Diagramm */
  .pages { display:flex; flex-wrap:wrap; gap:var(--s5); justify-content:center;
           overflow-x:auto; scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
  .pagecap { text-align:center; font-family:var(--mono); font-size:.78rem; color:var(--ink-2);
             margin-bottom:var(--s2); }
  table.kv { border-collapse:collapse; margin:0 auto; font-family:var(--mono); }
  table.kv th { color:var(--ink-3); font-size:.76rem; font-weight:600; padding:3px 7px; }
  table.kv td { border:1px solid var(--line); width:60px; height:58px; padding:0; position:relative;
                background:var(--panel); }
  table.kv td > button { width:100%; height:100%; border:0; background:none; font:inherit;
                         font-size:1.05rem; font-weight:700; cursor:pointer; color:inherit;
                         position:relative; z-index:2; display:flex; flex-direction:column;
                         align-items:center; justify-content:center; }
  table.kv td.hl { background:var(--sunk); }
  .pages.small td { width:46px; height:44px; }
  .pages.small td.brk-l, .pages.small td.brk-r { width:26px; }
  .pages.small td.brk-t, .pages.small td.brk-b { height:24px; }
  .pages.small td > button { font-size:.95rem; }
  /* Klammern am Rand: zeigen, wo eine Variable 1 (A) bzw. 0 (Ā) ist */
  table.kv td.brk { border:0; background:none; padding:0; position:relative; }
  table.kv td.brk-l, table.kv td.brk-r { width:30px; }
  table.kv td.brk-t, table.kv td.brk-b { height:28px; }
  table.kv td.brk i { position:absolute; border-color:var(--ink-2); border-style:solid; border-width:0; }
  table.kv td.brk-t i { left:4px; right:4px; bottom:0; height:8px;
                        border-top-width:2px; border-left-width:2px; border-right-width:2px; }
  table.kv td.brk-b i { left:4px; right:4px; top:0; height:8px;
                        border-bottom-width:2px; border-left-width:2px; border-right-width:2px; }
  table.kv td.brk-l i { top:4px; bottom:4px; right:0; width:8px;
                        border-left-width:2px; border-top-width:2px; border-bottom-width:2px; }
  table.kv td.brk-r i { top:4px; bottom:4px; left:0; width:8px;
                        border-right-width:2px; border-top-width:2px; border-bottom-width:2px; }
  table.kv td.brk b { position:absolute; font-size:.88rem; font-weight:700; color:var(--ink); line-height:1; }
  table.kv td.brk-t b { left:0; right:0; top:2px; text-align:center; }
  table.kv td.brk-b b { left:0; right:0; bottom:2px; text-align:center; }
  table.kv td.brk-l b { left:0; width:20px; top:50%; transform:translateY(-50%); text-align:right; }
  table.kv td.brk-r b { right:0; width:20px; top:50%; transform:translateY(-50%); text-align:left; }
  .lit { display:block; font-size:.56rem; font-style:normal; font-weight:400; line-height:1;
         color:var(--ink-3); margin-top:3px; letter-spacing:.03em; }
  .mi { position:absolute; left:4px; top:2px; font-size:.62rem; color:var(--ink-3); z-index:3; }
  .loop { position:absolute; border-radius:6px; pointer-events:none; z-index:1; }
  td.val button:hover, table.kv td > button:hover { background:color-mix(in srgb, var(--ink) 9%, transparent); }
  .v0 { color:var(--ink-3); font-weight:400 !important; }
  .v1 { color:var(--ink); }
  .v2 { color:var(--dc); }

  /* Blöcke */
  .terms { list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:var(--s2); }
  .terms li { display:flex; align-items:center; gap:var(--s2); padding:5px var(--s3) 5px var(--s2);
              border:1px solid var(--line); border-radius:var(--r-ctl); background:var(--panel); }
  .terms li:hover { background:var(--sunk); }
  .swatch { width:3px; align-self:stretch; border-radius:2px; }
  .terms b { font-family:var(--mono); font-weight:600; font-size:.95rem; }
  .terms .meta { color:var(--ink-3); font-size:.78rem; font-family:var(--mono); }

  /* Ergebnis */
  .expr { font-family:var(--mono); font-size:clamp(1rem, 1.1rem + .6vw, 1.45rem); font-weight:600;
          line-height:1.5; word-break:break-word; }
  .expr .lhs { color:var(--ink-3); font-weight:400; }
  .expr + .expr { margin-top:var(--s3); padding-top:var(--s3); border-top:1px solid var(--line-soft); }
  .expr .kind { display:block; font-family:system-ui, sans-serif; font-size:.74rem; font-weight:600;
                letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); margin-bottom:2px; }
  .neg { text-decoration:overline; text-underline-offset:2px; }
  #plain { font-family:var(--mono); font-size:.8rem; line-height:1.7; color:var(--ink-3);
           margin:var(--s4) 0 0; padding-top:var(--s3); border-top:1px solid var(--line-soft);
           white-space:pre-line; user-select:all; word-break:break-word; }
  #warn:not(:empty) { margin:var(--s3) 0 0; padding:var(--s2) var(--s3); font-size:.82rem;
                      border-left:3px solid var(--dc); background:color-mix(in srgb, var(--dc) 9%, transparent);
                      color:var(--ink); border-radius:0 var(--r-ctl) var(--r-ctl) 0; }

  /* Logikplan */
  #plan { overflow-x:auto; scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
  #plan svg { max-width:100%; height:auto; color:var(--ink); display:block; }
  #plan line, #plan polyline { fill:none; stroke:currentColor; stroke-width:1.5;
                               stroke-linecap:square; stroke-linejoin:miter; }
  #plan rect { fill:var(--panel); stroke:currentColor; stroke-width:1.5; }
  #plan circle { fill:currentColor; stroke:none; }
  #plan circle.bubble { fill:var(--panel); stroke:currentColor; stroke-width:1.5; }
  #plan text { fill:currentColor; font-family:var(--mono); font-size:12px; text-anchor:middle; }
  #plan text.sym { font-size:13px; font-weight:700; }
  #plan text.lbl { fill:var(--ink-2); font-size:11px; }

  /* Abhängigkeiten */
  .deps p { margin:0 0 var(--s2); }
  ul.dep { margin:var(--s2) 0 0; padding:0; list-style:none; }
  ul.dep li { padding:var(--s2) 0; border-top:1px solid var(--line-soft); font-size:.92rem; }
  ul.dep b { font-family:var(--mono); }
  .count { color:var(--ink-3); font-size:.82rem; margin-top:var(--s3); }
  @media print {
    /* immer helles Papier, auch wenn der Bildschirm dunkel ist */
    :root { --paper:#fff; --panel:#fff; --sunk:#f2f2f2; --ink:#000; --ink-2:#3a3a3a; --ink-3:#666;
            --line:#999; --line-soft:#c8c8c8; --dc:#8a5a00; }
    * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    @page { margin:14mm; }
    body { font-size:10.5px; }
    .wrap { max-width:none; padding:0; }
    header { border:0; background:none; }
    header .wrap { padding:0 0 10px; }
    main { padding-top:0; }
    .controls, #col, label[for="col"], #colmsg, #rowcount { display:none !important; }
    .cols { display:block; }
    .stack { gap:10px; }
    .panel { border:1px solid #bbb; border-radius:0; margin-bottom:10px; break-inside:avoid; }
    .panel > h2 { padding:6px 10px; }
    .body { padding:10px; }
    #tt { max-height:none; overflow:visible; margin-top:0; border:0; }
    .cols > .panel { width:fit-content; min-width:68mm; break-inside:auto; }
    table.tt { max-width:88mm; }
    table.tt th { position:static; }
    #plan { overflow:visible; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .seg button, .btn, td.val button, table.kv td > button { transition: background-color .12s ease; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>KV-Diagramm</h1>
    <p>Wertetabelle eintragen — Blöcke, minimale Gleichung und Abhängigkeiten entstehen mit.</p>
  </div>
</header>

<main class="wrap">
  <div class="panel controls">
    <div class="field">
      <span class="lbl">Variablen</span>
      <div class="seg" id="nvars" role="group" aria-label="Anzahl der Variablen">
        <button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button><button data-n="5">5</button><button data-n="6">6</button>
      </div>
      <span class="hint" id="varnames"></span>
    </div>
    <div class="field">
      <span class="lbl">Blöcke</span>
      <div class="seg" id="mode" role="group" aria-label="Welche Blöcke das Diagramm zeigt">
        <button data-mode="1">DNF · Einsen</button><button data-mode="0">KNF · Nullen</button>
      </div>
    </div>
    <div class="field">
      <button class="btn" id="clear">Zurücksetzen</button>
      <button class="btn" id="rand">Zufallswerte</button>
      <button class="btn" id="print">Als PDF / drucken</button>
    </div>
  </div>

  <div class="cols">
    <section class="panel">
      <h2>Wertetabelle <span class="tag" id="rowcount"></span></h2>
      <div class="body">
        <label class="hint" for="col">Y-Spalte von oben nach unten</label>
        <input id="col" spellcheck="false" autocomplete="off" aria-describedby="colmsg">
        <p class="hint" id="colmsg" style="margin:6px 0 0"></p>
        <div id="tt"></div>
      </div>
    </section>

    <div class="stack">
      <section class="panel">
        <h2>Diagramm <span class="tag" id="axes"></span></h2>
        <div class="body"><div id="map"></div></div>
      </section>

      <section class="panel">
        <h2>Blöcke</h2>
        <div class="body"><ul class="terms" id="groups"></ul></div>
      </section>

      <section class="panel">
        <h2>Minimale Gleichung</h2>
        <div class="body">
          <div class="expr" id="dnf"></div>
          <div class="expr" id="knf"></div>
          <p id="plain"></p>
          <p id="warn"></p>
        </div>
      </section>

      <section class="panel">
        <h2>Logikplan <span class="tag" id="plankind"></span></h2>
        <div class="body"><div id="plan"></div></div>
      </section>

      <section class="panel">
        <h2>Abhängigkeiten</h2>
        <div class="body deps" id="deps"></div>
      </section>
    </div>
  </div>
</main>

<script src="kv.js"></script>
<script>
(function () {
  'use strict';
  var GRAY = [0, 1, 3, 2];
  var COLORS = ['#d8453f', '#3b7dd8', '#2f9e55', '#c07c12', '#8f5cd6', '#128f9c', '#c9418a', '#7b8c2a'];
  var HINT = 'Klick schaltet 0 → 1 → X. Mit Tab anwählen und 0, 1 oder X tippen, ↑ ↓ wechselt die Zeile.';
  var kv = window.KV;
  var n = 4, mode = 1, vals = new Array(16).fill(0);
  var $ = function (id) { return document.getElementById(id); };

  function bitsOf(m, count) {
    var s = '';
    for (var i = count - 1; i >= 0; i--) s += (m >> i) & 1;
    return s;
  }
  function layout() { // ab 5 Variablen: mehrere verkoppelte Tafeln (führende Variablen = Tafel)
    var colBits = n >= 3 ? 2 : 1;
    var rowBits = Math.min(n - colBits, 2);
    var pageBits = n - colBits - rowBits;
    var axis = function (b) { return b === 1 ? [0, 1] : GRAY; };
    return { colBits: colBits, rowBits: rowBits, pageBits: pageBits,
             cols: axis(colBits), rows: axis(rowBits), pages: pageBits ? axis(pageBits) : [0] };
  }
  function mintermOf(L, p, r, c) { return (p << (L.rowBits + L.colBits)) | (r << L.colBits) | c; }
  function cycle(m) { vals[m] = (vals[m] + 1) % 3; render(); }
  function label(v) { return v === 2 ? 'X' : String(v); }

  function renderTruthTable() {
    var L = kv.VARS.slice(0, n), h = '<table class="tt"><thead><tr><th></th>';
    L.forEach(function (v) { h += '<th>' + v + '</th>'; });
    h += '<th>Y</th></tr></thead><tbody>';
    for (var m = 0; m < (1 << n); m++) {
      h += '<tr><td class="idx">' + m + '</td>';
      for (var i = 0; i < n; i++) h += '<td class="in">' + ((m >> (n - 1 - i)) & 1) + '</td>';
      h += '<td class="val"><button data-m="' + m + '" class="v' + vals[m] + '" aria-label="Zeile ' +
           m + ', Wert ' + label(vals[m]) + '">' + label(vals[m]) + '</button></td></tr>';
    }
    $('tt').innerHTML = h + '</tbody></table>';
    $('rowcount').textContent = (1 << n) + ' Zeilen';
  }

  function runsOf(axis, bit) { // zusammenhaengende Abschnitte, in denen die Variable gleich bleibt
    var out = [], i = 0;
    while (i < axis.length) {
      var pos = !!(axis[i] & bit), j = i;
      while (j + 1 < axis.length && !!(axis[j + 1] & bit) === pos) j++;
      out.push({ start: i, len: j - i + 1, pos: pos });
      i = j + 1;
    }
    return out;
  }
  function lit(name, pos) { return pos ? name : '<span class="neg">' + name + '</span>'; }
  function literalOf(m) {
    var out = '';
    for (var i = 0; i < n; i++) out += lit(kv.VARS[i], m & (1 << (n - 1 - i)));
    return out;
  }

  function renderMap(res) {
    var L = layout();
    var pageVars = kv.VARS.slice(0, L.pageBits).join('');
    var rowVars = kv.VARS.slice(L.pageBits, L.pageBits + L.rowBits);
    var colVars = kv.VARS.slice(L.pageBits + L.rowBits, n);
    $('axes').textContent = (L.pageBits ? L.pages.length + ' Tafeln · ' : '') +
      rowVars.join('') + ' × ' + colVars.join('');

    // Höchstwertige Variable einer Achse klammert die Hälften (links/oben),
    // die niederwertige die Mitte (rechts/unten) – wie in der Lehrbuchdarstellung.
    var left = { name: rowVars[0], runs: runsOf(L.rows, 1 << (L.rowBits - 1)) };
    var right = L.rowBits > 1 ? { name: rowVars[1], runs: runsOf(L.rows, 1) } : null;
    var top = { name: colVars[0], runs: runsOf(L.cols, 1 << (L.colBits - 1)) };
    var bottom = L.colBits > 1 ? { name: colVars[1], runs: runsOf(L.cols, 1) } : null;
    var showLit = n <= 4;

    function hRow(bar, where) {
      var h = '<tr><td class="brk"></td>';
      bar.runs.forEach(function (r) {
        h += '<td class="brk brk-' + where + '" colspan="' + r.len + '">' +
             '<b>' + lit(bar.name, r.pos) + '</b><i></i></td>';
      });
      return h + (right ? '<td class="brk"></td>' : '') + '</tr>';
    }

    var h = '<div class="pages' + (L.pageBits ? ' small' : '') + '">';
    L.pages.forEach(function (p) {
      h += '<div class="page">';
      if (L.pageBits) h += '<div class="pagecap">' + pageVars + ' = ' + bitsOf(p, L.pageBits) + '</div>';
      h += '<table class="kv">' + hRow(top, 't');
      L.rows.forEach(function (r, ri) {
        h += '<tr>';
        left.runs.forEach(function (run) {
          if (run.start === ri) h += '<td class="brk brk-l" rowspan="' + run.len + '">' +
            '<b>' + lit(left.name, run.pos) + '</b><i></i></td>';
        });
        L.cols.forEach(function (c) {
          var m = mintermOf(L, p, r, c);
          h += '<td data-m="' + m + '"><span class="mi">' + m + '</span>' +
               '<button data-m="' + m + '" class="v' + vals[m] + '" aria-label="Feld ' + m +
               ', Wert ' + label(vals[m]) + '"><b>' + label(vals[m]) + '</b>' +
               (showLit ? '<i class="lit">' + literalOf(m) + '</i>' : '') + '</button></td>';
        });
        if (right) right.runs.forEach(function (run) {
          if (run.start === ri) h += '<td class="brk brk-r" rowspan="' + run.len + '">' +
            '<i></i><b>' + lit(right.name, run.pos) + '</b></td>';
        });
        h += '</tr>';
      });
      if (bottom) h += hRow(bottom, 'b');
      h += '</table></div>';
    });
    $('map').innerHTML = h + '</div>';
    drawLoops(res, L);
  }

  // Blockrahmen: pro Zelle nur die Seiten zeichnen, an denen der (ggf. umlaufende) Nachbar fehlt.
  function drawLoops(res, L) {
    res.terms.forEach(function (t, gi) {
      var color = COLORS[gi % COLORS.length], inset = 3 + (gi % 4) * 3;
      var inGroup = {};
      t.cells.forEach(function (c) { inGroup[c] = true; });
      t.cells.forEach(function (m) {
        var p = m >> (L.rowBits + L.colBits);
        var r = (m >> L.colBits) & ((1 << L.rowBits) - 1), c = m & ((1 << L.colBits) - 1);
        var ri = L.rows.indexOf(r), ci = L.cols.indexOf(c);
        var cell = document.querySelector('td[data-m="' + m + '"]');
        if (!cell) return;
        function neighbor(dr, dc) {
          var nr = L.rows[(ri + dr + L.rows.length) % L.rows.length];
          var nc = L.cols[(ci + dc + L.cols.length) % L.cols.length];
          return inGroup[mintermOf(L, p, nr, nc)];
        }
        var d = document.createElement('div');
        d.className = 'loop';
        d.style.cssText = 'inset:' + inset + 'px;' +
          ['top:' + (neighbor(-1, 0) ? 0 : 2) + 'px solid ' + color,
           'bottom:' + (neighbor(1, 0) ? 0 : 2) + 'px solid ' + color,
           'left:' + (neighbor(0, -1) ? 0 : 2) + 'px solid ' + color,
           'right:' + (neighbor(0, 1) ? 0 : 2) + 'px solid ' + color]
          .map(function (s) { return 'border-' + s; }).join(';');
        cell.appendChild(d);
      });
    });
  }

  function pretty(t, target) {
    var parts = t.literals.map(function (l) { return l.neg ? '<span class="neg">' + l.name + '</span>' : l.name; });
    if (!parts.length) return '1';
    return target === 1 ? parts.join('·') : '(' + parts.join(' + ') + ')';
  }
  function prettyResult(res) {
    if (res.constant !== null) return String(res.constant);
    return res.terms.map(function (t) { return pretty(t, res.target); }).join(res.target === 1 ? ' + ' : ' · ');
  }

  function renderGroups(res) {
    if (!res.terms.length) {
      $('groups').innerHTML = '<li class="hint" style="border:0;background:none;padding-left:0">Keine Blöcke – die Funktion ist konstant ' +
        res.constant + '.</li>';
      return;
    }
    $('groups').innerHTML = res.terms.map(function (t, i) {
      return '<li data-g="' + i + '"><span class="swatch" style="background:' + COLORS[i % COLORS.length] +
        '"></span><b>' + pretty(t, res.target) + '</b><span class="meta">' + t.cells.length + 'er · ' +
        t.cells.join(' ') + '</span></li>';
    }).join('');
    Array.prototype.forEach.call($('groups').children, function (li) {
      var g = res.terms[+li.dataset.g];
      if (!g) return;
      li.onmouseenter = function () {
        g.cells.forEach(function (m) {
          var td = document.querySelector('td[data-m="' + m + '"]');
          if (td) td.classList.add('hl');
        });
      };
      li.onmouseleave = function () {
        Array.prototype.forEach.call(document.querySelectorAll('td.hl'), function (td) { td.classList.remove('hl'); });
      };
    });
  }

  // Logikplan: zweistufig. DNF -> & je Term, dann >=1. KNF -> umgekehrt.
  // Jeder Gattereingang bekommt seinen eigenen beschrifteten Anschluss (Variablen duerfen
  // mehrfach auftauchen), die Negation sitzt als Punkt direkt am Eingang statt als Inverter.
  function renderPlan(res) {
    $('plankind').textContent = res.target === 1 ? 'aus der DNF' : 'aus der KNF';
    if (res.constant !== null) {
      $('plan').innerHTML = '<p class="hint">Y ist konstant ' + res.constant +
        ' \u2013 daf\u00fcr braucht es keine Schaltung.</p>';
      return;
    }
    var symTerm = res.target === 1 ? '&' : '\u22651';
    var symOut = res.target === 1 ? '\u22651' : '&';

    var o = [];
    function sline(x1, y1, x2, y2) { o.push('<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"/>'); }
    function spoly(pts) { o.push('<polyline points="' + pts.map(function (q) { return q[0] + ',' + q[1]; }).join(' ') + '"/>'); }
    function srect(x, y, w, h) { o.push('<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="2"/>'); }
    function stext(x, y, str, cls) { o.push('<text x="' + x + '" y="' + y + '"' + (cls ? ' class="' + cls + '"' : '') + '>' + str + '</text>'); }
    function input(xEnd, y, name, neg) {          // Buchstabe, Leitung, bei Negation ein Punkt
      stext(xEnd - 40, y + 4, name);
      sline(xEnd - 30, y, xEnd - (neg ? 7 : 0), y);
      if (neg) o.push('<circle class="bubble" cx="' + (xEnd - 3.6) + '" cy="' + y + '" r="3.4"/>');
    }

    var GX = 48, GW = 46, ROW = 14;
    var gates = [], direct = [], y = 18;
    res.terms.forEach(function (t) {
      if (t.literals.length > 1) {
        var h = Math.max(30, t.literals.length * ROW + 12);
        gates.push({ t: t, y: y, h: h });
        y += h + 16;
      } else direct.push(t);                       // ein Literal braucht kein Gatter
    });
    var bottom = gates.length ? y - 16 : 18;
    var nIn = gates.length + direct.length, multi = nIn > 1;
    var OUT_X = gates.length
      ? GX + GW + 18 + gates.length * 7 + (direct.length ? 42 : 14)
      : GX;
    var oh = Math.max(30, nIn * ROW + 12);
    var oy = Math.max(14, Math.round((18 + bottom) / 2 - oh / 2));
    var endX = (multi ? OUT_X + GW : (gates.length ? GX + GW : OUT_X)) + 44;

    gates.forEach(function (g) {
      srect(GX, g.y, GW, g.h);
      stext(GX + GW / 2, g.y + 15, symTerm, 'sym');
      var top = g.y + (g.h - (g.t.literals.length - 1) * ROW) / 2;
      g.t.literals.forEach(function (l, j) { input(GX, top + j * ROW, l.name, l.neg); });
      g.out = { x: GX + GW, y: g.y + g.h / 2 };
    });

    if (multi) {
      srect(OUT_X, oy, GW, oh);
      stext(OUT_X + GW / 2, oy + 15, symOut, 'sym');
      var k = 0, top0 = oy + (oh - (nIn - 1) * ROW) / 2;
      gates.forEach(function (g, i) {              // eigener Kanal je Gatter, damit nichts ueberlappt
        var iy = top0 + (k++) * ROW, cx = GX + GW + 10 + i * 7;
        spoly([[g.out.x, g.out.y], [cx, g.out.y], [cx, iy], [OUT_X, iy]]);
      });
      direct.forEach(function (t) {
        var iy = top0 + (k++) * ROW;
        input(OUT_X, iy, t.literals[0].name, t.literals[0].neg);
      });
      sline(OUT_X + GW, oy + oh / 2, endX - 24, oy + oh / 2);
      stext(endX - 10, oy + oh / 2 + 4, 'Y');
    } else if (gates.length) {
      sline(gates[0].out.x, gates[0].out.y, endX - 24, gates[0].out.y);
      stext(endX - 10, gates[0].out.y + 4, 'Y');
    } else {                                       // Y = A bzw. Y = /A: nur eine Leitung
      var only = direct[0].literals[0], sy = 30;
      input(OUT_X, sy, only.name, only.neg);
      sline(OUT_X, sy, endX - 24, sy);
      stext(endX - 10, sy + 4, 'Y');
    }

    var H = Math.max(bottom, multi ? oy + oh : 46) + 14;
    $('plan').innerHTML = '<svg viewBox="0 0 ' + endX + ' ' + H + '" width="' + endX + '" height="' + H +
      '" role="img" aria-label="Logikplan zur minimalen Gleichung">' + o.join('') + '</svg>';
  }

  function renderDeps(dnf) {
    var used = {}, L = kv.VARS.slice(0, n);
    dnf.terms.forEach(function (t) { t.literals.forEach(function (l) { used[l.name] = true; }); });
    var unused = L.filter(function (v) { return !used[v]; });
    var lits = dnf.terms.reduce(function (s, t) { return s + t.literals.length; }, 0);
    if (dnf.constant !== null) {
      $('deps').innerHTML = '<p>Die Funktion ist konstant <b>' + dnf.constant + '</b> und hängt von keiner Variablen ab.</p>';
      return;
    }
    var h = '<p>Y hängt von <b>' + L.filter(function (v) { return used[v]; }).join(', ') + '</b> ab' +
      (unused.length ? '. <b>' + unused.join(', ') + '</b> ' + (unused.length > 1 ? 'fallen' : 'fällt') +
       ' beim Zusammenfassen weg' : '') + '.</p><ul class="dep">';
    dnf.terms.forEach(function (t) {
      var frei = L.filter(function (v) { return !t.literals.some(function (l) { return l.name === v; }); });
      h += '<li><b>' + pretty(t, 1) + '</b> wird 1, wenn ' +
        t.literals.map(function (l) { return l.name + ' = ' + (l.neg ? 0 : 1); }).join(' und ') +
        (frei.length ? ' – unabhängig von ' + frei.join(', ') : '') + '.</li>';
    });
    h += '</ul><p class="count">' + dnf.terms.length + (dnf.terms.length > 1 ? ' Terme' : ' Term') +
      ', ' + lits + (lits > 1 ? ' Literale' : ' Literal') +
      (dnf.terms.length > 1 ? ' · grob ' + dnf.terms.length + ' UND-Gatter und 1 ODER-Gatter' : '') + '.</p>';
    $('deps').innerHTML = h;
  }

  function renderCol() {
    if (document.activeElement === $('col')) return;
    var out = '';
    for (var m = 0; m < (1 << n); m++) out += label(vals[m]) + (m % 4 === 3 && m < (1 << n) - 1 ? ' ' : '');
    $('col').value = out;
    $('col').classList.remove('bad');
    $('colmsg').textContent = HINT;
  }

  function syncControls() {
    Array.prototype.forEach.call($('nvars').children, function (b) {
      b.setAttribute('aria-pressed', String(+b.dataset.n === n));
    });
    Array.prototype.forEach.call($('mode').children, function (b) {
      b.setAttribute('aria-pressed', String(+b.dataset.mode === mode));
    });
    $('varnames').textContent = kv.VARS[0] + '–' + kv.VARS[n - 1];
  }

  function render() {
    var dnf = kv.minimize(n, vals, 1), knf = kv.minimize(n, vals, 0);
    syncControls();
    renderTruthTable();
    renderCol();
    renderMap(mode === 1 ? dnf : knf);
    renderGroups(mode === 1 ? dnf : knf);
    renderPlan(mode === 1 ? dnf : knf);
    renderDeps(dnf);
    $('dnf').innerHTML = '<span class="kind">Disjunktive Normalform</span><span class="lhs">Y = </span>' + prettyResult(dnf);
    $('knf').innerHTML = '<span class="kind">Konjunktive Normalform</span><span class="lhs">Y = </span>' + prettyResult(knf);
    $('plain').textContent = 'DNF   ' + kv.resultText(dnf) + '\nKNF   ' + kv.resultText(knf);
    $('warn').textContent = (dnf.exact && knf.exact) ? '' :
      'Die Suche nach der absolut kürzesten Lösung wurde abgebrochen. Das Ergebnis stimmt mit der ' +
      'Wertetabelle überein und enthält keinen überflüssigen Term, es könnte aber eine kürzere Form geben.';
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-m]');
    if (b) cycle(+b.dataset.m);
  });

  function focusCell(scope, m) {
    var b = document.querySelector(scope + ' button[data-m="' + m + '"]');
    if (b) b.focus();
  }

  document.addEventListener('keydown', function (e) {
    var b = e.target.closest ? e.target.closest('button[data-m]') : null;
    if (!b) return;
    var m = +b.dataset.m, scope = b.closest('#tt') ? '#tt' : '#map', max = (1 << n) - 1;
    var moved = m, changed = false;
    if (e.key === '0' || e.key === '1') { vals[m] = +e.key; changed = true; }
    else if (e.key === 'x' || e.key === 'X') { vals[m] = 2; changed = true; }
    else if (e.key === 'ArrowDown' && scope === '#tt') moved = Math.min(m + 1, max);
    else if (e.key === 'ArrowUp' && scope === '#tt') moved = Math.max(m - 1, 0);
    else return;
    e.preventDefault();
    if (changed && scope === '#tt') moved = Math.min(m + 1, max); // zügig weitertippen
    if (changed) render();
    focusCell(scope, moved);
  });

  $('col').oninput = function () {
    var cs = this.value.toUpperCase().replace(/[^01X]/g, ''), need = 1 << n;
    if (cs.length !== need) {
      this.classList.add('bad');
      $('colmsg').textContent = cs.length + ' von ' + need + ' Werten – gebraucht werden genau ' + need + ' Zeichen (0, 1, X).';
      return;
    }
    this.classList.remove('bad');
    $('colmsg').textContent = 'Übernommen.';
    for (var m = 0; m < need; m++) vals[m] = cs[m] === 'X' ? 2 : +cs[m];
    render();
  };

  $('nvars').onclick = function (e) {
    var b = e.target.closest('button[data-n]');
    if (!b) return;
    n = +b.dataset.n;
    vals = new Array(1 << n).fill(0);
    render();
  };
  $('mode').onclick = function (e) {
    var b = e.target.closest('button[data-mode]');
    if (!b) return;
    mode = +b.dataset.mode;
    render();
  };
  $('print').onclick = function () { window.print(); };
  $('clear').onclick = function () { vals = new Array(1 << n).fill(0); render(); };
  $('rand').onclick = function () {
    vals = new Array(1 << n).fill(0).map(function () { return Math.random() < 0.45 ? 1 : 0; });
    render();
  };

  render();
})();
</script>
</body>
</html>
